[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dflash"
version = "0.1.0"
description = "DFlash: Block Diffusion for Flash Speculative Decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm==4.70.0",
    "datasets==5.0.1",
    "requests==2.34.2",
]

[project.scripts]
dflash = "dflash.cli:main"

[tool.setuptools.packages.find]
include = ["dflash*"]

[project.optional-dependencies]
local = [
    "jinja2==3.1.6; sys_platform == 'linux'",
    "torch==2.13.0; sys_platform == 'linux'",
    "transformers==5.15.0; sys_platform == 'linux'",
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub==1.27.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
