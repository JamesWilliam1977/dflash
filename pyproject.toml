[project]
name = "dflash"
version = "0.1.0"
description = "DFlash: Block Diffusion for Flash Speculative Decoding"
requires-python = ">=3.10"
dependencies = [
    "tqdm==4.70.0",
    "datasets==5.0.1",
    "requests==2.34.2",
]

[tool.setuptools.packages.find]
include = ["dflash*"]

[project.optional-dependencies]
transformers = [
    "torch==2.13.0",
    "transformers==5.15.0",
]
mlx = [
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "huggingface-hub==1.27.0",
]
